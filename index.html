<meta charset="utf-8">
<title>拉开他</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400;600&display=swap">

<style>
  :root{
    --night:#0B0D1F;
    --night-2:#171A3C;
    --glow:255 201 120;
    --glow-deep:255 158 94;
    --skin:#E8A376;
    --skin-lit:#F8CA9D;
    --skin-hi:#FFEEDB;
    --skin-mid:#D1865C;
    --skin-shade:#A85C40;
    --skin-deep:#6D3524;
    --skin-bounce:#C87A52;
    --skin-glow:#FFC98A;
    --line:#5A2A1C;
    --bg:#0B0D1F;
    --dots:0;
    --ink:#4A2A1C;
    --text:#EFE2D4;
    --text-soft:#9E9289;
    --hurt:255 107 107;

    --brush:"Ma Shan Zheng","STKaiti","KaiTi",serif;
    --serif:"Noto Serif SC","Songti SC","SimSun",serif;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    overflow:hidden;
    background:var(--night);
    color:var(--text);
    font-family:var(--serif);
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }
  button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}
  :focus-visible{outline:2px solid rgb(var(--glow));outline-offset:4px;border-radius:6px}

  #dust{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}

  /* the pool of candlelight the hand sits in */
  #halo{
    position:fixed;left:50%;top:50%;z-index:0;
    width:min(150vmin,1100px);aspect-ratio:1;
    transform:translate(-50%,-50%) scale(var(--halo-s,1));
    background:radial-gradient(circle at 50% 46%,
      rgb(var(--glow) / calc(.20 * var(--halo-a,1))) 0%,
      rgb(var(--glow-deep) / calc(.11 * var(--halo-a,1))) 26%,
      rgb(var(--glow-deep) / 0) 62%);
    pointer-events:none;
    will-change:transform;
  }
  #vignette{
    position:fixed;inset:0;z-index:3;pointer-events:none;
    background:radial-gradient(130% 95% at 50% 46%, rgb(11 13 31 / 0) 42%, rgb(11 13 31 / .72) 100%);
  }

  #stage{
    position:fixed;inset:0;z-index:2;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(14px,3.2vh,30px);
    padding:max(18px,env(safe-area-inset-top)) 20px max(18px,env(safe-area-inset-bottom));
    opacity:0;transition:opacity 1.4s ease;
  }
  #stage.lit{opacity:1}

  /* ---------- the hand ---------- */
  #handwrap{
    position:relative;
    width:min(74vw,340px);
    flex:0 0 auto;
    touch-action:none;
    transform:translateY(var(--jolt-y,0)) rotate(var(--jolt-r,0deg));
  }
  #handwrap svg{display:block;width:100%;height:auto;overflow:visible}
  #handwrap.grabbable{cursor:grab}
  #handwrap.grabbing{cursor:grabbing}

  .ink{
    font-family:var(--brush);
    fill:var(--ink);
    text-anchor:middle;
    dominant-baseline:central;
    pointer-events:none;
    letter-spacing:2px;
  }

  #f-thumb{transition:filter .5s ease}
  #handwrap.thumb-live #f-thumb{
    cursor:pointer;
    filter:drop-shadow(0 0 10px rgb(var(--glow) / .85)) drop-shadow(0 0 24px rgb(var(--glow) / .45));
    animation:breathe 2.4s ease-in-out infinite;
  }
  @keyframes breathe{0%,100%{opacity:1}50%{opacity:.82}}

  /* ---------- words ---------- */
  #hint{
    margin:0;min-height:1.6em;
    font-size:clamp(.82rem,2.6vw,.95rem);
    font-weight:300;letter-spacing:.3em;text-indent:.3em;
    color:var(--text-soft);
    opacity:0;transition:opacity .9s ease;
    text-align:center;
  }
  #hint.show{opacity:1}

  #choices{
    display:flex;gap:clamp(10px,3vw,18px);flex-wrap:wrap;justify-content:center;
    opacity:0;transform:translateY(14px);pointer-events:none;
    transition:opacity .7s ease,transform .7s cubic-bezier(.22,1,.36,1);
  }
  #choices.show{opacity:1;transform:none;pointer-events:auto}
  #choices button{
    padding:13px 26px;border-radius:999px;
    border:1px solid rgb(var(--glow) / .42);
    background:rgb(var(--glow) / .05);
    font-size:clamp(.92rem,3vw,1.02rem);font-weight:400;letter-spacing:.12em;
    color:var(--text);
    transition:border-color .3s ease,background .3s ease,transform .3s cubic-bezier(.22,1,.36,1);
  }
  #choices button:hover{
    border-color:rgb(var(--glow) / .9);
    background:rgb(var(--glow) / .13);
    transform:translateY(-2px);
  }
  #choices button:active{transform:translateY(0)}

  #ouch{
    position:fixed;left:50%;top:38%;z-index:6;
    transform:translate(-50%,-50%) scale(.6);
    font-family:var(--brush);
    font-size:clamp(4rem,22vw,10rem);
    color:rgb(var(--hurt));
    text-shadow:0 0 40px rgb(var(--hurt) / .55);
    opacity:0;pointer-events:none;
  }
  #ouch.show{animation:ouch 1.5s cubic-bezier(.22,1,.36,1) forwards}
  @keyframes ouch{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.5) rotate(-8deg)}
    18%{opacity:1;transform:translate(-50%,-50%) scale(1.12) rotate(4deg)}
    30%{transform:translate(-50%,-50%) scale(1) rotate(-2deg)}
    72%{opacity:1}
    100%{opacity:0;transform:translate(-50%,-50%) scale(1.04)}
  }

  /* ---------- the hand becomes the words ---------- */
  #burst{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}

  /* a time tunnel: each line spirals out of the vanishing point toward you */
  #letters{
    position:fixed;inset:0;z-index:4;pointer-events:none;overflow:hidden;
    perspective:760px;perspective-origin:50% 46%;
  }
  .letter{
    position:absolute;left:50%;top:46%;margin:0;
    font-family:var(--brush);
    font-size:clamp(1.1rem,4.2vw,1.66rem);
    line-height:1.5;white-space:nowrap;
    color:var(--text);
    text-shadow:0 0 16px rgb(var(--glow) / .6), 0 0 44px rgb(var(--glow) / .3);
    opacity:0;will-change:transform,opacity;
    animation:tunnel 9s linear forwards;
  }
  @keyframes tunnel{
    0%{
      opacity:0;
      transform:rotate(var(--a0)) translateX(24px) rotate(calc(-1 * var(--a0)))
                translateZ(-1500px) translate(-50%,-50%);
    }
    11%{opacity:1}
    70%{opacity:1}
    100%{
      opacity:0;
      transform:rotate(calc(var(--a0) + 400deg)) translateX(300px) rotate(calc(-1 * var(--a0) - 400deg))
                translateZ(470px) translate(-50%,-50%);
    }
  }

  #final{
    position:fixed;inset:0;z-index:8;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(20px,5vh,40px);padding:32px 24px;text-align:center;
    opacity:0;pointer-events:none;transition:opacity 2s ease;
  }
  #final.show{opacity:1;pointer-events:auto}
  #final .line{
    margin:0;font-family:var(--brush);
    font-size:clamp(2rem,9.6vw,4.6rem);line-height:1.38;
    color:var(--text);text-wrap:balance;
    text-shadow:0 0 30px rgb(var(--glow) / .55), 0 0 80px rgb(var(--glow) / .28);
  }
  #final .sig{
    margin:0;font-family:var(--serif);font-weight:300;
    font-size:.8rem;letter-spacing:.42em;text-indent:.42em;
    color:var(--text-soft);
  }
  #again{
    padding:12px 28px;border-radius:999px;
    border:1px solid rgb(var(--glow) / .34);
    font-size:.86rem;font-weight:300;letter-spacing:.16em;
    color:var(--text-soft);
    transition:border-color .3s ease,color .3s ease;
  }
  #again:hover{border-color:rgb(var(--glow) / .8);color:var(--text)}

  /* ---------- the flight down the hole ---------- */
  #flight{
    position:fixed;inset:0;z-index:6;
    opacity:0;pointer-events:none;
    perspective:820px;perspective-origin:50% 50%;
  }
  #flight.on{opacity:1}
  #streaks{position:absolute;inset:0;width:100%;height:100%}
  #cam{
    position:absolute;left:50%;top:50%;width:0;height:0;
    transform-style:preserve-3d;
  }
  .ring{
    position:absolute;left:0;top:0;
    border-radius:50%;
    border:2.5px solid rgb(var(--glow) / .5);
    box-shadow:0 0 26px rgb(var(--glow) / .3), inset 0 0 30px rgb(var(--glow-deep) / .22);
    will-change:transform,opacity;
  }
  .vision{
    position:absolute;left:0;top:0;
    width:1120px;height:747px;
    margin:-373px 0 0 -560px;
    opacity:0;
    will-change:transform,opacity;
  }
  .vision svg{display:block;width:100%;height:100%;overflow:visible}

  /* placeholder art, replaced once the illustrations land */
  .vision.stub{
    display:grid;place-items:center;
    border-radius:28px;
    background:radial-gradient(60% 60% at 50% 50%, rgb(var(--glow) / .16), rgb(var(--glow) / 0) 70%);
    font-family:var(--brush);font-size:3rem;color:rgb(var(--glow));
    box-shadow:inset 0 0 90px rgb(var(--glow) / .18);
  }

  /* ---------- where the wind drops her ---------- */
  #arrival{
    position:fixed;inset:0;z-index:7;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(16px,4vh,34px);padding:28px 20px max(28px,env(safe-area-inset-bottom));
    opacity:0;pointer-events:none;transition:opacity 1.5s ease;
  }
  #arrival.show{opacity:1;pointer-events:auto}
  #car{
    width:min(94vw,860px);flex:0 0 auto;
    opacity:0;transform:translateY(16px) scale(.985);
    transition:opacity 1.6s ease, transform 1.8s cubic-bezier(.22,1,.36,1);
  }
  #car.in{opacity:1;transform:none}
  #car svg{display:block;width:100%;height:auto;overflow:visible}
  #car.stub{
    height:min(44vh,330px);border-radius:24px;
    display:grid;place-items:center;
    background:radial-gradient(60% 70% at 50% 60%, rgb(var(--glow) / .14), rgb(var(--glow) / 0) 72%);
    font-family:var(--brush);font-size:2.4rem;color:rgb(var(--glow) / .9);
  }
  #question{
    margin:0;font-family:var(--brush);
    font-size:clamp(1.8rem,8vw,4.1rem);line-height:1.34;text-wrap:balance;
    color:var(--text);
    text-shadow:0 0 34px rgb(var(--glow) / .6), 0 0 90px rgb(var(--glow) / .3);
    opacity:0;transform:translateY(14px);
    transition:opacity 1.8s ease, transform 1.8s cubic-bezier(.22,1,.36,1);
  }
  #question.in{opacity:1;transform:none}
  #arrival .sig{
    margin:0;font-family:var(--serif);font-weight:300;
    font-size:.78rem;letter-spacing:.42em;text-indent:.42em;color:var(--text-soft);
    opacity:0;transition:opacity 1.6s ease;
  }
  #arrival .sig.in{opacity:.7}

  /* ---------- 未完待续 ---------- */
  #next{
    position:fixed;inset:0;z-index:7;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(18px,4vh,34px);padding:32px 24px;text-align:center;
    opacity:0;pointer-events:none;transition:opacity 1.6s ease;
  }
  #next.show{opacity:1;pointer-events:auto}
  #next .beat{
    margin:0;font-family:var(--brush);
    color:var(--text);
    opacity:0;transform:translateY(12px);
    transition:opacity 1.1s ease,transform 1.1s cubic-bezier(.22,1,.36,1);
  }
  #next .beat.show{opacity:1;transform:none}
  #next .b1{font-size:clamp(2.6rem,11vw,5rem);line-height:1}
  #next .b2{font-size:clamp(1.3rem,5.4vw,2.1rem);line-height:1.6;color:rgb(var(--glow))}
  #next .tbc{
    margin:0;font-family:var(--serif);font-weight:300;
    font-size:.8rem;letter-spacing:.42em;text-indent:.42em;
    color:var(--text-soft);
    opacity:0;transition:opacity 1.4s ease;
  }
  #next .tbc.show{opacity:.75}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important}
  }
</style>

         Contract: root svg carries --open (0 = fist, 1 = open palm)

#f-index > .seg2 > .seg3{transform-origin:139px 162px;transform:rotate(calc(68deg - var(--open) * 70deg))}
#f-thumb{transform-origin:114px 400px;transform:rotate(calc(58deg - var(--open) * 94deg - var(--thumb) * 40deg))}
#f-thumb > .seg2{transform-origin:114px 336px;transform:rotate(calc(34deg - var(--open) * 44deg))}

/* ---- paint: every colour resolves through a :root custom property ---- */
.c-hi{stop-color:var(--skin-hi)}
.c-lit{stop-color:var(--skin-lit)}
.c-skin{stop-color:var(--skin)}
.c-mid{stop-color:var(--skin-mid)}
.c-shade{stop-color:var(--skin-shade)}
.c-deep{stop-color:var(--skin-deep)}
.c-bounce{stop-color:var(--skin-bounce)}
.c-glow{stop-color:var(--skin-glow)}
.c-bg{stop-color:var(--bg)}
.wrist{fill:url(#gWrist)}
.palm{fill:url(#gPalm)}
.palmedge{fill:url(#gShade);opacity:.55}
.sg{fill:url(#gSeg)}
.j{fill:url(#gJoint)}
.hl{fill:url(#gHi);opacity:.5}
.pad{fill:url(#gHi);opacity:.42}
.sh{fill:url(#gShade);opacity:.5}
.cr{fill:url(#gDeep);opacity:calc(var(--open)*0.4)}
.thenar{fill:url(#gThenar)}
.hypo{fill:url(#gShade);opacity:.6}
.hollow{fill:url(#gShade);opacity:.42}
.palmhi{fill:url(#gHi);opacity:.4}
.knuck{fill:url(#gHi);opacity:calc((1 - var(--open))*0.45)}
.wristshade{fill:url(#gDeep);opacity:.4}
.web{fill:url(#gDeep);opacity:calc(var(--open)*0.5)}
.crease{fill:none;stroke:var(--skin-deep);stroke-width:4.5;stroke-linecap:round;opacity:calc(var(--open)*0.26)}
.rim{fill:none;stroke:var(--skin-glow);stroke-width:3.2;stroke-linecap:round;opacity:.3}
.fade{fill:url(#gFade)}
        #ink-fist{opacity:calc(1 - var(--open) * 2.6)}
        #ink-palm{opacity:calc((var(--open) - .62) * 2.7 * var(--palm-ink, 1))}
        #ink-clap{opacity:var(--clap-ink, 0)}
      </style>

<script>
(function(){
  "use strict";

  var hand    = document.getElementById("hand");
  var wrap    = document.getElementById("handwrap");
  var stage   = document.getElementById("stage");
  var halo    = document.getElementById("halo");
  var hintEl  = document.getElementById("hint");
  var choices = document.getElementById("choices");
  var ouch    = document.getElementById("ouch");
  var nextEl  = document.getElementById("next");
  var burst   = document.getElementById("burst");
  var letters = document.getElementById("letters");
  var finalEl = document.getElementById("final");
  var reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  var LINES = [
    "Mandy 老婆要早点睡觉",
    "我喜欢老婆",
    "我爱老婆",
    "Mandy 是我这辈子一定要守护的可爱老婆",
    "老婆要多喝水多休息",
    "老婆新学期加油",
    "老婆最厉害",
    "特别特别爱老婆",
    "我申请完第一件事就是宠老婆",
    "爱你老婆",
    "老婆学习加油",
    "我将永远听老婆的话",
    "我是老婆永远的小狗狗",
    "我喜欢我的老婆",
    "老婆说话最重要",
    "我要永远守护老婆",
    "老婆我会永远爱着你"
  ];

  var PULL = 230;              // px of upward drag for a full unfurl
  var scene = "fist";
  var open = 0, thumb = 0;
  var dragging = false, grabY = 0, grabOpen = 0;
  var idleTimer = null;

  /* ---------- tiny tween engine ---------- */
  var tweens = [];
  function tween(o){
    var t = {
      from: o.from, to: o.to,
      dur: reduced ? Math.min(o.dur, 120) : o.dur,
      ease: o.ease || easeOut,
      step: o.step, done: o.done,
      t0: performance.now(), tag: o.tag
    };
    tweens = tweens.filter(function(x){ return x.tag !== t.tag; });
    tweens.push(t);
    return t;
  }
  function easeOut(p){ return 1 - Math.pow(1 - p, 3); }
  function easeInOut(p){ return p < .5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3) / 2; }
  function easeBack(p){ var c = 1.70158, s = c + 1; return 1 + s*Math.pow(p-1,3) + c*Math.pow(p-1,2); }

  function runTweens(now){
    for (var i = tweens.length - 1; i >= 0; i--){
      var t = tweens[i];
      var p = t.dur <= 0 ? 1 : Math.min(1, (now - t.t0) / t.dur);
      t.step(t.from + (t.to - t.from) * t.ease(p));
      if (p >= 1){ tweens.splice(i, 1); if (t.done) t.done(); }
    }
  }

  function setOpen(v){ open = v; hand.style.setProperty("--open", v.toFixed(4)); paintHalo(); }
  function setThumb(v){ thumb = v; hand.style.setProperty("--thumb", v.toFixed(4)); }

  /* the light swells as the hand opens */
  function paintHalo(){
    halo.style.setProperty("--halo-a", (.72 + open * .5).toFixed(3));
    halo.style.setProperty("--halo-s", (.9 + open * .16).toFixed(3));
  }

  function say(text){
    if (hintEl.textContent === text) return;
    hintEl.classList.remove("show");
    setTimeout(function(){
      hintEl.textContent = text;
      if (text) hintEl.classList.add("show");
    }, text ? 420 : 0);
  }
  function idle(ms, fn){
    clearTimeout(idleTimer);
    idleTimer = setTimeout(fn, ms);
  }

  /* ---------- scene 1: pull it open ---------- */
  function armPull(){
    scene = "fist";
    wrap.classList.add("grabbable");
    idle(1800, function(){ if (scene === "fist" && open < .04) say("往上拉"); });
  }

  wrap.addEventListener("pointerdown", function(e){
    if (scene !== "fist") return;
    dragging = true;
    grabY = e.clientY;
    grabOpen = open;
    wrap.setPointerCapture(e.pointerId);
    wrap.classList.add("grabbing");
    tweens = tweens.filter(function(t){ return t.tag !== "open"; });
    say("");
    clearTimeout(idleTimer);
  });

  wrap.addEventListener("pointermove", function(e){
    if (!dragging) return;
    var v = grabOpen + (grabY - e.clientY) / PULL;
    setOpen(Math.max(0, Math.min(1, v)));
  });

  function releasePull(e){
    if (!dragging) return;
    dragging = false;
    wrap.classList.remove("grabbing");
    try { wrap.releasePointerCapture(e.pointerId); } catch (err) {}

    if (open > .5){
      wrap.classList.remove("grabbable");
      tween({ tag:"open", from:open, to:1, dur:620, ease:easeBack,
        step:setOpen, done:toPalm });
    } else {
      tween({ tag:"open", from:open, to:0, dur:520, ease:easeOut,
        step:setOpen, done:armPull });
    }
  }
  wrap.addEventListener("pointerup", releasePull);
  wrap.addEventListener("pointercancel", releasePull);

  /* keyboard path, so the surprise is never a dead end */
  document.addEventListener("keydown", function(e){
    if (scene !== "fist") return;
    if (e.key === "ArrowUp" || e.key === "Enter" || e.key === " "){
      e.preventDefault();
      wrap.classList.remove("grabbable");
      say("");
      tween({ tag:"open", from:open, to:1, dur:900, ease:easeBack, step:setOpen, done:toPalm });
    }
  });

  /* ---------- scene 2: turn the thumb ---------- */
  function toPalm(){
    scene = "palm";
    setOpen(1);
    wrap.classList.add("thumb-live");
    idle(900, function(){ say("点一下大拇指"); });
  }

  wrap.addEventListener("click", function(e){
    if (scene === "palm"){
      if (e.target.closest && e.target.closest("#f-thumb")) toChoice();
      return;
    }
    if (scene === "clap") dissolve(e.clientX, e.clientY);
  });

  /* ---------- scene 3: how hard? ---------- */
  function toChoice(){
    scene = "choice";
    clearTimeout(idleTimer);
    wrap.classList.remove("thumb-live");
    say("");
    choices.classList.add("show");
  }

  choices.addEventListener("click", function(e){
    var btn = e.target.closest("button");
    if (!btn || scene !== "choice") return;
    choices.classList.remove("show");
    if (btn.dataset.force === "hard") tooHard();
    else justRight();
  });

  /* ---------- 4a: 用力 ---------- */
  function tooHard(){
    scene = "hurt";
    tween({ tag:"thumb", from:thumb, to:1, dur:130, ease:easeOut, step:setThumb });
    jolt();
    ouch.classList.remove("show");
    void ouch.offsetWidth;
    ouch.classList.add("show");

    setTimeout(function(){
      tween({ tag:"thumb", from:1, to:0, dur:900, ease:easeOut, step:setThumb });
      say("…轻一点好不好");
    }, 620);

    setTimeout(function(){
      say("");
      scene = "choice";
      choices.classList.add("show");
    }, 2300);
  }

  function jolt(){
    if (reduced) return;
    var t0 = performance.now(), dur = 520;
    (function shake(now){
      var p = (now - t0) / dur;
      if (p >= 1){ wrap.style.setProperty("--jolt-y","0px"); wrap.style.setProperty("--jolt-r","0deg"); return; }
      var decay = Math.pow(1 - p, 2.2);
      wrap.style.setProperty("--jolt-y", (Math.sin(p * 46) * 13 * decay).toFixed(2) + "px");
      wrap.style.setProperty("--jolt-r", (Math.sin(p * 38) * 3.4 * decay).toFixed(2) + "deg");
      requestAnimationFrame(shake);
    })(t0);
  }

  /* ---------- 4b: 轻轻 ---------- */
  function justRight(){
    scene = "turn";
    tween({ tag:"thumb", from:thumb, to:1, dur:reduced ? 300 : 2000, ease:easeInOut,
      step:function(v){
        setThumb(v);
        halo.style.setProperty("--halo-a", (1.22 + v * 1.5).toFixed(3));
        halo.style.setProperty("--halo-s", (1.06 + v * .3).toFixed(3));
      },
      done:toClap });
  }

  /* ---------- scene 5: 拍一下手掌 ---------- */
  function toClap(){
    scene = "clap";
    tween({ tag:"ink", from:0, to:1, dur:1000, ease:easeOut, step:function(v){
      hand.style.setProperty("--palm-ink", (1 - v).toFixed(3));
      hand.style.setProperty("--clap-ink", v.toFixed(3));
    }});
    wrap.style.cursor = "pointer";
    idle(2400, function(){ if (scene === "clap") say("拍一下"); });
  }

  /* ---------- scene 6: the hand comes apart ---------- */
  var parts = [], pmode = "idle", pt0 = 0, lastT = 0;

  function sampleHand(){
    var out = [], shapes = hand.querySelectorAll("path,ellipse,rect,circle,polygon");
    var pt = hand.createSVGPoint();
    for (var i = 0; i < shapes.length && out.length < 1700; i++){
      var el = shapes[i], cs = getComputedStyle(el);
      if (cs.display === "none" || parseFloat(cs.opacity) < .08 || cs.fill === "none") continue;
      var bb; try { bb = el.getBBox(); } catch (err) { continue; }
      if (!(bb.width > 0 && bb.height > 0)) continue;
      var m = el.getScreenCTM(); if (!m) continue;
      var want = Math.max(5, Math.min(220, Math.round(bb.width * bb.height / 300)));
      var tries = 0, got = 0;
      while (got < want && tries < want * 12){
        tries++;
        pt.x = bb.x + Math.random() * bb.width;
        pt.y = bb.y + Math.random() * bb.height;
        var inside = true;
        try { inside = el.isPointInFill(pt); } catch (err) { inside = true; }
        if (!inside) continue;
        got++;
        out.push({ x: m.a * pt.x + m.c * pt.y + m.e, y: m.b * pt.x + m.d * pt.y + m.f });
      }
    }
    return out;
  }

  function dissolve(cx0, cy0){
    scene = "dissolve";
    clearTimeout(idleTimer);
    say("");
    wrap.style.cursor = "";

    var pts = sampleHand();
    if (!pts.length){                       // nothing to sample: skip straight to the words
      stage.style.opacity = "0";
      setTimeout(runLetters, 700);
      return;
    }

    parts = pts.map(function(p){
      var dx = p.x - cx0, dy = p.y - cy0, d = Math.hypot(dx, dy) || 1;
      var sp = 90 + Math.random() * 230;
      return {
        x: p.x, y: p.y,
        vx: dx / d * sp + (Math.random() - .5) * 70,
        vy: dy / d * sp + (Math.random() - .5) * 70 - 70,
        wait: d * 0.0016,                   // a shockwave rippling out from where she touched
        a: .5 + Math.random() * .5,
        sz: .6 + Math.random() * 1.8
      };
    });
    pmode = "burst"; pt0 = performance.now(); lastT = pt0;

    stage.style.transition = "opacity .34s ease";
    stage.style.opacity = "0";

    setTimeout(toVortex, 900);
    setTimeout(runLetters, 1700);
  }

  function toVortex(){
    var cx = window.innerWidth / 2, cy = window.innerHeight * .46;
    for (var i = 0; i < parts.length; i++){
      var p = parts[i], dx = p.x - cx, dy = (p.y - cy) / .62;
      p.rad = Math.max(40, Math.hypot(dx, dy));
      p.ang = Math.atan2(dy, dx);
      p.spin = .9 + Math.random() * .6;
      p.vr = -(26 + Math.random() * 70);
    }
    pmode = "vortex";
  }

  function stepParts(now){
    var dt = Math.min(.05, (now - lastT) / 1000); lastT = now;
    var cx = window.innerWidth / 2, cy = window.innerHeight * .46;
    var i, p;

    if (pmode === "burst"){
      var el = (now - pt0) / 1000;
      for (i = 0; i < parts.length; i++){
        p = parts[i];
        if (el < p.wait) continue;
        p.x += p.vx * dt; p.y += p.vy * dt;
        p.vx *= .965; p.vy = p.vy * .965 + 40 * dt;
      }
    } else if (pmode === "vortex"){
      for (i = 0; i < parts.length; i++){
        p = parts[i];
        p.ang += p.spin * (150 / (p.rad + 90)) * dt * 5.4;
        p.rad += p.vr * dt;
        if (p.rad < 24){                    // swallowed by the mouth, thrown back out wide
          p.rad = Math.max(window.innerWidth, window.innerHeight) * (.45 + Math.random() * .3);
          p.ang = Math.random() * Math.PI * 2;
        }
        p.x = cx + Math.cos(p.ang) * p.rad;
        p.y = cy + Math.sin(p.ang) * p.rad * .62;
      }
    }
  }

  function drawParts(){
    bctx.clearRect(0, 0, BW, BH);
    if (pmode === "idle" || !parts.length) return;
    var cx = window.innerWidth / 2, cy = window.innerHeight * .46;
    var reach = Math.max(window.innerWidth, window.innerHeight) * .6;
    bctx.globalCompositeOperation = "lighter";
    for (var i = 0; i < parts.length; i++){
      var p = parts[i];
      var d = Math.hypot(p.x - cx, p.y - cy);
      var hot = Math.max(0, 1 - d / reach);
      var a = p.a * (pmode === "vortex" ? (.18 + hot * .82) : 1) * fade;
      if (a <= .01) continue;
      bctx.fillStyle = "rgba(255," + Math.round(186 + hot * 54) + "," + Math.round(104 + hot * 70) + "," + a.toFixed(3) + ")";
      bctx.beginPath();
      bctx.arc(p.x, p.y, p.sz * (1 + hot * .5), 0, Math.PI * 2);
      bctx.fill();
    }
    bctx.globalCompositeOperation = "source-over";
  }

  /* ---------- scene 7: the words come out of the hole ---------- */
  var fade = 1;

  function runLetters(){
    scene = "letters";
    var flying = LINES.slice(0, LINES.length - 1);
    flying.forEach(function(t, i){
      setTimeout(function(){ spawnLetter(t, i); }, i * 1150);
    });
    setTimeout(toFinal, (flying.length - 1) * 1150 + 7400);
  }

  function spawnLetter(text, i){
    var el = document.createElement("p");
    el.className = "letter";
    el.textContent = text;
    el.style.setProperty("--a0", ((i * 137.5) % 360).toFixed(1) + "deg");
    letters.appendChild(el);
    setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 9600);
  }

  /* the last line holds alone for a beat, then the camera falls into the hole */
  function toFinal(){
    scene = "lastword";
    finalEl.querySelector(".sig").style.display = "none";
    finalEl.querySelector("#again").style.display = "none";
    finalEl.classList.add("show");
    setTimeout(function(){
      finalEl.style.transition = "opacity 1.1s ease";
      finalEl.classList.remove("show");
      setTimeout(diveIn, 700);
    }, 3000);
  }

  function toArrival(){
    var ar = document.getElementById("arrival");
    var car = document.getElementById("car");
    var q = document.getElementById("question");
    ar.classList.add("show");
    halo.style.setProperty("--halo-a", ".9");
    halo.style.setProperty("--halo-s", "1.1");
    setTimeout(function(){ car.classList.add("in"); }, 700);
    setTimeout(function(){ q.classList.add("in"); }, 3400);
    setTimeout(function(){ ar.querySelector(".sig").classList.add("in"); }, 5200);
  }

  document.getElementById("again").addEventListener("click", function(){ location.reload(); });
  document.getElementById("again2").addEventListener("click", function(){ location.reload(); });

  /* ============================================================
     scene 8: first-person flight down the hole
     ============================================================ */
  var flight  = document.getElementById("flight");
  var cam     = document.getElementById("cam");
  var streaks = document.getElementById("streaks");
  var sctx    = streaks.getContext("2d");

  var YAW_SIGN = 1;                  // +1 puts a +X panel in front of you when you look right; -1 swings it behind your head
  var RINGS = 58, GAP = 260;

  /* t = seconds since the dive began. sp = forward speed in px/s. */
  var SHOT = [
    { t: 0.0,  yaw:   0, pitch:  0, roll:   0, sp:  260 },
    { t: 1.3,  yaw:   0, pitch:  0, roll:   0, sp: 1500 },
    { t: 2.6,  yaw: -23, pitch:  4, roll:  -3, sp: 1500 },   // 左顾
    { t: 4.0,  yaw:  19, pitch: -3, roll:   2, sp: 1500 },   // 右盼
    { t: 5.2,  yaw:   0, pitch:  0, roll:   0, sp: 1600 },
    { t: 6.4,  yaw:  62, pitch: -2, roll:   5, sp: 1300 },   // 猛地向右 — 王者
    { t: 9.8,  yaw:  58, pitch:  0, roll:   4, sp: 1300 },
    { t:11.0,  yaw:   0, pitch:  0, roll:   0, sp: 1700 },
    { t:12.4,  yaw: -15, pitch:  3, roll:  -2, sp: 1700 },
    { t:13.6,  yaw:  64, pitch: -3, roll:   6, sp: 1250 },   // 再向右 — 相拥
    { t:17.0,  yaw:  60, pitch:  0, roll:   5, sp: 1250 },
    { t:18.2,  yaw:   0, pitch:  0, roll:   0, sp: 1900 },
    { t:19.4,  yaw:   7, pitch: 36, roll: -27, sp: 5200 },   // 被一阵风拽起来
    { t:20.8,  yaw:  -5, pitch: 11, roll:   9, sp: 7200 },
    { t:21.9,  yaw:   0, pitch:  0, roll:   0, sp: 9400 }
  ];
  var SHOT_END = SHOT[SHOT.length - 1].t;

  function smooth(p){ return p * p * (3 - 2 * p); }

  function shotAt(t){
    if (t <= SHOT[0].t) return SHOT[0];
    for (var i = 1; i < SHOT.length; i++){
      if (t > SHOT[i].t) continue;
      var a = SHOT[i - 1], b = SHOT[i];
      var k = smooth((t - a.t) / (b.t - a.t));
      return {
        yaw:   a.yaw   + (b.yaw   - a.yaw)   * k,
        pitch: a.pitch + (b.pitch - a.pitch) * k,
        roll:  a.roll  + (b.roll  - a.roll)  * k,
        sp:    a.sp    + (b.sp    - a.sp)    * k
      };
    }
    return SHOT[SHOT.length - 1];
  }

  /* integrate the speed curve once, so panels can be parked at the depth
     the camera will actually have reached at the moment we look at them */
  var ZTAB = [], ZSTEP = 0.02;
  (function buildZ(){
    var z = 0;
    for (var t = 0; t <= SHOT_END + ZSTEP; t += ZSTEP){
      ZTAB.push(z);
      z += shotAt(t).sp * ZSTEP;
    }
  })();
  function zAt(t){
    var i = Math.max(0, Math.min(ZTAB.length - 1, Math.round(t / ZSTEP)));
    return ZTAB[i];
  }

  var rings = [], visions = [];

  function buildTunnel(){
    var frag = document.createDocumentFragment();
    for (var i = 0; i < RINGS; i++){
      var el = document.createElement("div");
      el.className = "ring";
      frag.appendChild(el);
      rings.push({ el: el, z: i * GAP, phase: i * 0.42, hue: i });
    }
    cam.appendChild(frag);

    visions = [
      { el: document.getElementById("v-kings"), z: zAt(8.1)  + 277, x: 520, rot: -62 },
      { el: document.getElementById("v-hug"),   z: zAt(15.3) + 287, x: 540, rot: -64 }
    ];
    visions.forEach(function(v){
      v.el.style.transform = "translateZ(" + (-v.z) + "px) translateX(" + v.x + "px) rotateY(" + v.rot + "deg)";
    });
  }

  /* one field of view for every screen: P scales with the viewport */
  function sizeLens(){
    var P = Math.max(400, Math.min(1120, window.innerWidth * .82));
    flight.style.perspective = P.toFixed(0) + "px";
    letters.style.perspective = (P * .93).toFixed(0) + "px";
  }

  function sizeStreaks(){
    var r = Math.min(window.devicePixelRatio || 1, 2);
    streaks.width = window.innerWidth * r;
    streaks.height = window.innerHeight * r;
    sctx.setTransform(r, 0, 0, r, 0, 0);
  }

  var flying = false, fly0 = 0, camZ = 0, flash = 0;

  function diveIn(){
    scene = "flight";
    buildTunnel();
    sizeLens();
    sizeStreaks();
    flight.classList.add("on");
    letters.style.transition = "opacity .9s ease";
    letters.style.opacity = "0";
    tween({ tag:"vfade", from:1, to:0, dur:1200, ease:easeInOut, step:function(v){
      fade = v;
      halo.style.setProperty("--halo-a", (v * 1.4).toFixed(3));
    }, done:function(){ pmode = "idle"; parts = []; } });
    flying = true;
    fly0 = performance.now();
  }

  function flightFrame(now){
    if (!flying) return;
    var t = (now - fly0) / 1000;
    var st = shotAt(t);
    camZ = zAt(Math.min(t, SHOT_END));
    if (t > SHOT_END) camZ += st.sp * (t - SHOT_END);

    cam.style.transform =
      "rotateZ(" + st.roll.toFixed(2) + "deg) " +
      "rotateX(" + st.pitch.toFixed(2) + "deg) " +
      "rotateY(" + (YAW_SIGN * st.yaw).toFixed(2) + "deg) " +
      "translateZ(" + camZ.toFixed(1) + "px)";

    var span = RINGS * GAP, i, r, d;
    for (i = 0; i < rings.length; i++){
      r = rings[i];
      d = r.z - camZ;
      if (d < 60){ r.z += span; d = r.z - camZ; }
      var size = 520 + Math.sin(r.phase + t * .5) * 170;
      var a = d > span * .86 ? 0 : Math.min(1, (span - d) / (span * .5)) * Math.min(1, (d - 60) / 420);
      r.el.style.width = size + "px";
      r.el.style.height = size + "px";
      r.el.style.opacity = a.toFixed(3);
      r.el.style.transform =
        "translateZ(" + (-r.z) + "px) rotateZ(" + ((r.phase * 46 + t * 26) % 360).toFixed(1) + "deg) translate(-50%,-50%)";
    }

    for (i = 0; i < visions.length; i++){
      var v = visions[i];
      d = v.z - camZ;
      var o;
      if (d > 4600 || d < -1900) o = 0;
      else if (d > 2000)  o = (4600 - d) / 2600;      // swimming up out of the dark ahead
      else if (d > -700)  o = 1;                      // right beside you
      else                o = (d + 1900) / 1200;      // falling away behind
      v.el.style.opacity = Math.max(0, Math.min(1, o)).toFixed(3);
    }

    drawStreaks(st.sp, t);

    if (t > SHOT_END + .35 && scene === "flight") arrive();
  }

  function drawStreaks(sp, t){
    var W = window.innerWidth, H = window.innerHeight, cx = W / 2, cy = H / 2;
    sctx.clearRect(0, 0, W, H);
    var n = 150, len = Math.min(.62, sp / 11000);
    sctx.lineCap = "round";
    for (var i = 0; i < n; i++){
      var a = (i * 2.39996 + t * .12) % (Math.PI * 2);
      var rr = ((i * 0.6180339 + t * (sp / 2600)) % 1);
      var r0 = 60 + rr * rr * Math.max(W, H) * .95;
      var r1 = r0 * (1 + len);
      var al = (1 - rr) * .5 * Math.min(1, sp / 1400);
      if (al < .012) continue;
      sctx.strokeStyle = "rgba(255," + Math.round(200 - rr * 40) + "," + Math.round(140 - rr * 40) + "," + al.toFixed(3) + ")";
      sctx.lineWidth = .8 + (1 - rr) * 2.1;
      sctx.beginPath();
      sctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0 * .92);
      sctx.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1 * .92);
      sctx.stroke();
    }
    if (flash > .002){
      sctx.fillStyle = "rgba(255,224,180," + flash.toFixed(3) + ")";
      sctx.fillRect(0, 0, W, H);
    }
  }

  function arrive(){
    scene = "arrive";
    tween({ tag:"flash", from:0, to:1, dur:420, ease:easeOut, step:function(v){ flash = v; },
      done:function(){
        flying = false;
        flight.classList.remove("on");
        toArrival();
        tween({ tag:"flash", from:1, to:0, dur:1500, ease:easeInOut, step:function(v){
          flash = v;
          sctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
          if (v > .002){
            sctx.fillStyle = "rgba(255,224,180," + v.toFixed(3) + ")";
            sctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
          }
        }});
      }});
  }

  /* ---------- dust in the light ---------- */
  var cv = document.getElementById("dust"), ctx = cv.getContext("2d");
  var motes = [], W = 0, H = 0;

  function sizeDust(){
    var r = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * r; cv.height = H * r;
    ctx.setTransform(r, 0, 0, r, 0, 0);
  }
  function seedDust(){
    motes = [];
    var n = Math.round(Math.min(46, Math.max(18, W / 34)));
    for (var i = 0; i < n; i++){
      motes.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: .6 + Math.random() * 1.9,
        v: .07 + Math.random() * .26,
        a: .12 + Math.random() * .4,
        p: Math.random() * Math.PI * 2,
        w: .003 + Math.random() * .007
      });
    }
  }
  function drawDust(move){
    ctx.clearRect(0, 0, W, H);
    var cx = W / 2, cy = H * .46, reach = Math.min(W, H) * .62;
    for (var i = 0; i < motes.length; i++){
      var m = motes[i];
      if (move){
        m.y -= m.v; m.p += m.w;
        if (m.y < -4){ m.y = H + 4; m.x = Math.random() * W; }
      }
      var x = m.x + Math.sin(m.p) * 16;
      var d = Math.hypot(x - cx, m.y - cy);
      var fall = Math.max(0, 1 - d / reach);          // only dust inside the light shows
      if (fall <= 0) continue;
      ctx.beginPath();
      ctx.fillStyle = "rgba(255,214,150," + (m.a * fall * fall).toFixed(3) + ")";
      ctx.arc(x, m.y, m.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  function dustLoop(){ drawDust(true); requestAnimationFrame(dustLoop); }

  /* ---------- raise the lights ---------- */
  var bctx = burst.getContext("2d"), BW = 0, BH = 0;
  function sizeBurst(){
    var r = Math.min(window.devicePixelRatio || 1, 2);
    BW = window.innerWidth; BH = window.innerHeight;
    burst.width = BW * r; burst.height = BH * r;
    bctx.setTransform(r, 0, 0, r, 0, 0);
  }

  function frame(now){
    runTweens(now);
    stepParts(now);
    drawParts();
    flightFrame(now);
    requestAnimationFrame(frame);
  }

  sizeDust(); seedDust(); drawDust(false); sizeBurst(); sizeLens();
  window.addEventListener("resize", function(){
    sizeDust(); seedDust(); drawDust(false); sizeBurst(); sizeStreaks(); sizeLens();
  });

  setOpen(0); setThumb(0);
  requestAnimationFrame(frame);
  if (!reduced) dustLoop();

  /* jump straight to a scene for previewing: #words / #fly / #arrive */
  var jump = (location.hash || "").slice(1);
  if (jump === "words" || jump === "fly" || jump === "arrive"){
    stage.style.opacity = "0";
    if (jump === "words") setTimeout(runLetters, 400);
    if (jump === "fly")   setTimeout(diveIn, 400);
    if (jump === "arrive") setTimeout(function(){ sizeStreaks(); toArrival(); }, 400);
  } else {
    setTimeout(function(){ stage.classList.add("lit"); armPull(); }, 260);
  }
})();
</script>
